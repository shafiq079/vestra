services:
  - type: web
    name: vestra-backend
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PIXELCUT_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_SERVICE_KEY
        sync: false
      - key: ML_SERVICE_TIMEOUT_MS
        value: 5000

  - type: web
    name: vestra-size-ml
    runtime: python
    plan: free
    branch: main
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ML_SERVICE_KEY
        sync: false
      - key: ML_ENABLE_DOCS
        value: false
